name: 'Setup Bun and Install'
description: 'Sets up Bun and installs dependencies'
runs:
  using: 'composite'
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version-file: package.json
    - name: Install dependencies
      run: bun install
      shell: bash
