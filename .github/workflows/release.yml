name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and publish'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Verify draft and version
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/validate-calver.sh "$RELEASE_TAG"
          bash scripts/release/validate-metadata.sh "$RELEASE_TAG"
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == true ]]

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: bun run build

      - name: Attach assets to the draft
        run: gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber

      - name: Publish release
        run: gh release edit "$RELEASE_TAG" --draft=false
