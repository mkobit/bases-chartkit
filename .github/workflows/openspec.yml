name: OpenSpec

on:
  push:
    branches: ['main']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
      - '.github/actions/setup-env/action.yml'
      - 'package.json'
  pull_request:
    branches: ['**']
    paths:
      - 'openspec/**'
      - '.github/workflows/openspec.yml'
      - '.github/actions/setup-env/action.yml'
      - 'package.json'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-env
      - name: Validate OpenSpec specs and changes
        run: bun run openspec:validate
