name: OpenSpec

on:
  push:
    branches: ["main"]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "openspec/**"
      - ".github/workflows/openspec.yml"
  workflow_dispatch: {}

env:
  BUN_VERSION: "1.3.12"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Validate OpenSpec specs and changes
        run: bun exec openspec validate --all
