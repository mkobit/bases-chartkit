version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "mkobit"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 14
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "mkobit"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "obsidian"
    cooldown:
      default-days: 14
    groups:
      typescript:
        patterns:
          - "typescript"
      linters:
        patterns:
          - "eslint*"
          - "@eslint*"
          - "@stylistic*"
          - "typescript-eslint*"
          - "@typescript-eslint*"
          - "*eslint*"
      bun-ecosystem:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "eslint*"
          - "@eslint*"
          - "@stylistic*"
          - "typescript-eslint*"
          - "@typescript-eslint*"
          - "*eslint*"
