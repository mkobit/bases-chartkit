schemaVersion: "1"
name: bases-chartkit-agy
agent: antigravity
workspace:
  path: ..
  clone: false
kits:
  - "git+https://github.com/docker/sbx-kits-contrib.git#ref=21e1928b5fe0036163307ea8047e48390f2d6fec&dir=antigravity"
  - ./kit
ports:
  - sandbox: 6080
    host: 6080
  - sandbox: 5900
    host: 5900
  - sandbox: 9222
    host: 9222
  - sandbox: 5173
    host: 5173
args:
  hostGeminiDir:
    default: /home/mkobit/.gemini/antigravity-cli
additionalWorkspaces:
  - path: ${{ env.args.hostGeminiDir }}
    readOnly: true
