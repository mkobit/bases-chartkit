schemaVersion: "2"
kind: mixin
name: bases-chartkit-toolchain
version: "0.1.0"
description: Bootstrap mise, bun, beads, and virtual display environment for Obsidian and bases-chartkit

permissions:
  network:
    allow:
      - mise.run
      - mise.jdx.dev
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - bun.sh
      - releases.obsidian.md
      - github-releases.githubusercontent.com

ports:
  - container: 6080
    protocol: tcp
    name: novnc
  - container: 5900
    protocol: tcp
    name: vnc
  - container: 9222
    protocol: tcp
    name: cdp
  - container: 5173
    protocol: tcp
    name: dev

environment:
  variables:
    PATH: /home/agent/.local/share/mise/shims:/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    MISE_YES: "1"
    DISPLAY: ":99"
    XDG_RUNTIME_DIR: /tmp/runtime-agent

setup:
  install:
    - command: |
        sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          unzip \
          xz-utils \
          xvfb \
          xauth \
          fluxbox \
          x11vnc \
          novnc \
          websockify \
          libasound2t64 \
          libatk-bridge2.0-0t64 \
          libatk1.0-0t64 \
          libatspi2.0-0t64 \
          libcairo2 \
          libcups2t64 \
          libdbus-1-3 \
          libdrm2 \
          libegl1 \
          libgbm1 \
          libgl1 \
          libgles2 \
          libglib2.0-0t64 \
          libgtk-3-0t64 \
          libnspr4 \
          libnss3 \
          libpango-1.0-0 \
          libsecret-1-0 \
          libx11-6 \
          libx11-xcb1 \
          libxcb1 \
          libxcb-dri3-0 \
          libxcomposite1 \
          libxdamage1 \
          libxext6 \
          libxfixes3 \
          libxkbcommon0 \
          libxrandr2 \
          libxshmfence1 \
          fonts-liberation \
          fonts-noto-color-emoji && \
        sudo rm -rf /var/lib/apt/lists/*
      description: "Install prerequisite system packages, virtual display server, and Electron runtime dependencies"
    - command: |
        curl -fsSL https://mise.run | MISE_VERSION=v2026.8.14 MISE_INSTALL_PATH=/usr/local/bin/mise sh
        echo 'if command -v mise >/dev/null 2>&1; then eval "$(mise activate bash)"; fi' | sudo tee /etc/profile.d/mise.sh > /dev/null
      description: "Install mise into /usr/local/bin and configure profile"
    - command: "mise settings set paranoid false && mise settings set yes true && mise use -g bun@1.4.2 && mise use -g github:gastownhall/beads@1.1.0"
      user: "1000"
      description: "Install bun 1.4.2 and beads 1.1.0 for agent"
    - command: "mkdir -p -m 0700 /tmp/runtime-agent && chown -R 1000:1000 /tmp/runtime-agent"
      description: "Initialize runtime directory for Obsidian CLI IPC sockets"
  startup:
    - command: ["bash", "-c", "Xvfb :99 -screen 0 1920x1080x24 -listen tcp -ac & sleep 1 && fluxbox & sleep 1 && x11vnc -display :99 -forever -shared -rfbport 5900 -nopw & websockify --web /usr/share/novnc 6080 localhost:5900"]
      background: true
      description: "Launch virtual display, window manager, and noVNC streaming server"
